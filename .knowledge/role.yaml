gaps:
  - README「架构/数据存储」节仍写旧路径 ~/.dsh/im-channel/credentials/shared-memory.json，与 src/memory-store.ts 现行 $DSH_HOME/dsh-memory/ 不一致（README 未随迁移更新）
  - GET /dsh-memory/entries 与 /archive 无按用户权限过滤（代码注释自认待 webServer 会话身份），管理页为主人视图
  - tools.ts preset 固定以 (userId='master', isMaster=true) 注册；IM 渠道覆盖为真实身份的逻辑在 im-channel 仓，未在本仓代码内
  - docs/决策记忆治理-设计.md、memory-admin-page.ts、MemoryView.tsx 仅抽读（头部/导出/调用点），未逐行通读
  - 「对话区第三个 Tab」的最终排序取决于其他插件的 slot order，本仓仅能证实自身 order: 20
