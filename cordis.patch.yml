- insert:
    - id: dsh-memory
      name: '@dsh-extra/dsh-memory'
      provide: [dsh-memory]
      # webServer 不是硬依赖：核心功能（provide 服务 + 工具注册）不需要 webServer，
      # 只有 HTTP API 路由需要（apply 里用 ctx.inject 可选注入）。
      # 去掉 inject 硬依赖，让插件尽早加载并 provide 服务，
      # 避免 im-channel 在 agent 创建时 ctx.get('dsh-memory') 返回 undefined。
      config: {}
